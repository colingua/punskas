<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Punskas Lexicon</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="app">
    <div id="chrome" class="chrome">
      <h1>Punskas Lexicon</h1>
      <p id="modeBadge" class="status"></p>
    </div>
    <div id="view"></div>
  </div>

  <input type="file" id="importFile" accept="application/json,.json" class="hidden" />

  <!-- Optional: omit config.js → viewer defaults. Optional: omit data.js → empty until import. -->
  <script src="config.js" onerror="window.__PUNSKAS_NO_CONFIG__=true"></script>
  <script src="data.js" onerror="window.__PUNSKAS_NO_SEED__=true"></script>
  <script src="app.js"></script>
</body>
</html>
